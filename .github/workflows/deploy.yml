name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 번 배포되지 않도록 순서대로 처리한다
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew test bootJar

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload jar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            build/libs/ecoguard-server-0.0.1-SNAPSHOT.jar \
            "$SSH_USER@$SSH_HOST:/opt/ecoguard/app.jar"

      - name: Restart and health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          sudo systemctl restart ecoguard
          # 부팅에 20~40초 걸리므로 최대 3분까지 기다린다
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/api/v1/auth/callback?code=test&state=abc" || true)
            if [ "$code" = "302" ]; then
              echo "OK: 서버가 정상 기동했습니다 (HTTP $code)"
              systemctl is-active ecoguard
              exit 0
            fi
            sleep 3
          done
          echo "FAIL: 서버가 정상 기동하지 않았습니다 (마지막 HTTP $code)"
          journalctl -u ecoguard -n 50 --no-pager || true
          exit 1
          REMOTE
