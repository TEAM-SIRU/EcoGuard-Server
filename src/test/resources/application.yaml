spring:
  datasource:
    url: jdbc:h2:mem:ecoguard;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: test-secret-key-for-jwt-signing-please-make-it-long-enough-1234567890

gsm:
  oauth:
    mock: true

ai-server:
  base-url: http://localhost:19999

# 운영 설정(application.yaml)과 같게, 명세 문서는 기본으로 끈다.
swagger:
  enabled: ${SWAGGER_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${swagger.enabled}
  swagger-ui:
    enabled: ${swagger.enabled}
