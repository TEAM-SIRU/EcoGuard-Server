spring:
  application:
    name: EcoGuard-Server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecoguard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-make-it-long-enough}
  access-token-validity-seconds: ${JWT_ACCESS_VALIDITY:7200}
  refresh-token-validity-seconds: ${JWT_REFRESH_VALIDITY:1209600}

gsm:
  oauth:
    # datagsm.kr/clients 에서 OAuth 클라이언트를 등록하면 client-id / client-secret(API 키)을 발급받는다.
    # 실 연동을 켜려면 GSM_OAUTH_MOCK=false 로 두고, 아래 세 값을 환경변수로 채워 넣으면 된다.
    mock: ${GSM_OAUTH_MOCK:true}
    client-id: ${GSM_OAUTH_CLIENT_ID:}
    client-secret: ${GSM_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GSM_OAUTH_REDIRECT_URI:}
    authorization-base-url: ${GSM_OAUTH_AUTHORIZATION_BASE_URL:https://oauth.authorization.datagsm.kr}
    resource-base-url: ${GSM_OAUTH_RESOURCE_BASE_URL:https://oauth.resource.datagsm.kr}

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://localhost:9000}
  evaluate-path: /api/v1/cleaning/evaluate
  timeout-millis: 15000

file-storage:
  base-path: ${FILE_STORAGE_PATH:uploads}
  public-url-prefix: /files

# 청소구역(학교 도면) 초기 데이터. 구역을 만드는 API가 없으므로 여기에 실제 학교
# 구역을 정의해두면 서버 시작 시 자동으로 DB에 채워진다 (zone-code 기준 중복 생성 안 함).
# zone-code는 AI 서버의 zone_id와 반드시 일치해야 한다. 아래는 예시이므로 실제 값으로 교체할 것.
cleaning-area-seed:
  areas:
    - zone-code: zone_A
      name: 1학년 복도
      description: 1학년 교실 앞 복도
      clean-time: "08:00~08:10"
      x: 10
      y: 20
    - zone-code: zone_B
      name: 2학년 복도
      description: 2학년 교실 앞 복도
      clean-time: "08:00~08:10"
      x: 30
      y: 20

logging:
  level:
    team.siru.ecoguard: INFO
