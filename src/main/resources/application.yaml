spring:
  application:
    name: EcoGuard-Server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecoguard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 기본값은 validate. 빈 DB를 처음 만들 때만 DDL_AUTO=update 로 실행한다.
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 필수 환경변수(32바이트 이상). 기본값을 두지 않는다.
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_VALIDITY:7200}
  refresh-token-validity-seconds: ${JWT_REFRESH_VALIDITY:604800}

gsm:
  oauth:
    # datagsm.kr/clients 에서 OAuth 클라이언트를 등록하면 client-id / client-secret(API 키)을 발급받는다.
    # 실 연동을 켜려면 GSM_OAUTH_MOCK=false 로 두고, 아래 세 값을 환경변수로 채워 넣으면 된다.
    # mock=true 면 인가 코드 문자열만으로 교사 포함 아무 계정으로 로그인할 수 있으므로 로컬 개발에서만 켠다.
    mock: ${GSM_OAUTH_MOCK:false}
    client-id: ${GSM_OAUTH_CLIENT_ID:}
    client-secret: ${GSM_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GSM_OAUTH_REDIRECT_URI:}
    authorization-base-url: ${GSM_OAUTH_AUTHORIZATION_BASE_URL:https://oauth.authorization.datagsm.kr}
    resource-base-url: ${GSM_OAUTH_RESOURCE_BASE_URL:https://oauth.resource.datagsm.kr}

# 앱 스토어 심사용 데모 학생 계정. 심사 기간에만 켜고 끝나면 반드시 끈다.
demo-account:
  enabled: ${DEMO_ACCOUNT_ENABLED:false}
  auth-code: ${DEMO_ACCOUNT_AUTH_CODE:}

cors:
  # 쉼표로 구분한 허용 Origin 목록
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 사진 검수 방식. gemini(기본): Gemini API 로 검수하고 통과만 자동 승인한다.
# ai-server: 자체 AI 서버로 검수한다 (AI 모델이 준비되면 전환).
ai-review:
  provider: ${AI_REVIEW_PROVIDER:gemini}

# 무료 요금제는 분당 호출 수가 적어 동시 호출을 제한한다. 키가 비어 있으면 모든 인증이 교사 수동 검토로 넘어간다.
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  timeout-millis: 15000
  max-concurrency: 2

# 방학 기간에는 청소 인증을 막는다. NEIS 학사일정의 방학식~개학 사이를 방학으로 본다.
# 키나 학교 코드가 비어 있으면 방학 제한을 적용하지 않는다.
neis:
  api-key: ${NEIS_API_KEY:}
  education-office-code: ${NEIS_EDUCATION_OFFICE_CODE:}
  school-code: ${NEIS_SCHOOL_CODE:}

ai-server:
  base-url: ${AI_SERVER_BASE_URL:http://localhost:9000}
  evaluate-path: /api/v1/cleaning/evaluate
  timeout-millis: 15000

file-storage:
  base-path: ${FILE_STORAGE_PATH:uploads}
  public-url-prefix: /files

# 청소구역(학교 도면) 초기 데이터. 구역을 만드는 API가 없으므로 여기에 실제 학교
# 구역을 정의해두면 서버 시작 시 자동으로 DB에 채워진다 (zone-code 기준, 이미 있으면 활성 여부 외 값 갱신).
# zone-code는 AI 서버의 zone_id와 반드시 일치해야 한다.
# 확정된 18개 구역 목록. 학기별로 나누지 않고 하나의 목록으로 관리한다 (노션 "청소 구역" 페이지 기준).
# model-ready 기본값은 false이며, true 인 구역만 활성화할 수 있다.
# 지금은 Gemini 로 검수하므로 전 구역 true 이다. 자체 AI 서버(ai-review.provider=ai-server)로 전환하면
# AI 모델 학습이 끝난 구역만 true 로 두어야 한다.
# 앱은 좌표 대신 zone-code 로 도면의 칸을 찾아 표시한다.
cleaning-area-seed:
  areas:
    # ── 학기 구분 없이 18개 전체를 하나의 목록으로 관리 ──
    - zone-code: main_stair_a
      name: 본관 계단 A
      description: 본관 계단 A 1층→4층 (1→2층, 2→3층, 3→4층 구간 / 1층 현관 제외)
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_entrance_a
      name: 본관 1층 계단 A쪽 현관 및 신발장
      description: A쪽 현관, 신발장, 금봉관 연결통로 방향
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_stair_b
      name: 본관 계단 B
      description: 본관 계단 B 1층→4층 (1→2층, 2→3층, 3→4층 구간 / 1층 현관 제외)
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_stair_c
      name: 본관 계단 C
      description: 본관 계단 C 1층→4층 (1→2층, 2→3층, 3→4층 구간 / 1층 현관 제외)
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: practice_stair_d
      name: 본관(실습동) 계단 D
      description: 본관(실습동) 계단 D 1층→3층 (1층 현관, 1→2층, 2→3층 구간)
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: geumbong_stair_e
      name: 금봉관 계단 E
      description: 금봉관 계단 E 1층→4층 (1→2층, 2→3층, 3→4층 구간, 4층 철문 앞 / 1층 현관 제외)
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: geumbong_corridor_f1
      name: 금봉관 1층 복도
      description: 시청각실 앞부터 급식실 방향 현관까지 (현관 쓰레기통 주변 포함)
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: connector_f2
      name: 본관-금봉관 연결통로 2층
      description: 본관 쪽부터 금봉관 쪽까지 연결통로 전체
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: connector_f3
      name: 본관-금봉관 연결통로 3층
      description: 본관 쪽부터 금봉관 쪽까지 연결통로 전체
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: geumbong_corridor_f2
      name: 금봉관 2층 ㄱ자 복도
      description: 위클래스 앞부터 ㄱ자로 꺾이는 곳을 지나 끝까지
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: geumbong_corridor_f3
      name: 금봉관 3층 ㄱ자 복도
      description: 도서관 앞부터 ㄱ자로 꺾이는 곳을 지나 끝까지
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_fitness_room_f1
      name: 본관 1층 체력단련실
      description: 체력단련실 입구 쪽 및 내부
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_entrance_b
      name: 본관 1층 계단 B쪽 현관 및 외부 현관
      description: B쪽 현관 안쪽과 외부 현관
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_entrance_c
      name: 본관 1층 계단 C쪽 현관 및 외부 현관
      description: C쪽 현관 안쪽과 외부 현관
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_entrance_d
      name: 본관 1층 계단 D쪽 현관 및 신발장
      description: D쪽 현관, 신발장
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: connector_f1
      name: 본관-금봉관 연결통로 1층
      description: 본관 쪽부터 금봉관 쪽까지 연결통로 전체
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_corridor_f3
      name: 본관 3층 복도 + 홈베이스
      description: 본관 3층 복도 전체와 홈베이스
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true
    - zone-code: main_corridor_f4
      name: 본관 4층 복도 + 홈베이스
      description: 본관 4층 복도 전체와 홈베이스
      clean-time: "07:20~08:10"
      semester: COMMON
      model-ready: true

logging:
  level:
    team.siru.ecoguard: INFO
